{% extends 'base.html' %}
{% block title %}{{ title }} — GymLog{% endblock %}
{% block content %}
<div class="page-header">
  <h1>{{ title }}</h1>
  <a href="{% url 'workouts:exercise_list' %}" class="btn btn-secondary">← Volver</a>
</div>
<div class="card" style="max-width:560px;">
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
    <div class="form-group">
      <label>{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}<p style="color:var(--danger);font-size:12px;">{{ field.errors.0 }}</p>{% endif %}
    </div>
    {% endfor %}
    <div style="display:flex;gap:10px;margin-top:8px;">
      <button type="submit" class="btn btn-primary">{{ action }}</button>
      <a href="{% url 'workouts:exercise_list' %}" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
