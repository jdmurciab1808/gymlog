{% extends 'base.html' %}
{% block title %}Eliminar rutina — GymLog{% endblock %}
{% block content %}
<div class="page-header"><h1>Eliminar rutina</h1></div>
<div class="card" style="max-width:480px;">
  <p style="margin-bottom:20px;">¿Eliminar la rutina <strong>{{ routine.name }}</strong>? Las sesiones asociadas no se borrarán.</p>
  <form method="post" style="display:flex;gap:10px;">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
    <a href="{% url 'workouts:routine_list' %}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
