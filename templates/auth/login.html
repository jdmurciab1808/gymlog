<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — GymLog</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">
      <h1>GYMLOG</h1>
      <p>Ingresa a tu cuenta</p>
    </div>

    {% if form.errors %}
    <ul class="messages">
      <li class="error">Usuario o contraseña incorrectos.</li>
    </ul>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" name="username" class="form-input" placeholder="Tu usuario" autofocus>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" name="password" class="form-input" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;">
        Entrar →
      </button>
    </form>

    <p style="text-align:center;margin-top:20px;font-size:13px;color:var(--text-muted);">
      ¿Sin cuenta? <a href="{% url 'register' %}" style="color:var(--accent);">Regístrate gratis</a>
    </p>
  </div>
</div>
</body>
</html>
